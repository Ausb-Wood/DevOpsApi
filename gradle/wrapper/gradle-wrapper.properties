# GRADLE_USER_HOME ist normalerweise ~/.gradle.
distributionBase=GRADLE_USER_HOME
# Unterordner, in dem heruntergeladene Gradle-Versionen liegen.
distributionPath=wrapper/dists
# Exakte Gradle-Version für alle Rechner und die CI.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
# Abbruchzeit für Netzwerkverbindungen in Millisekunden.
networkTimeout=10000
# Prüft, ob die Download-Adresse plausibel ist.
validateDistributionUrl=true
# Speicherort der heruntergeladenen ZIP-Datei.
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
