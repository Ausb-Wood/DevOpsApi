name: CI and Minikube Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: task-api-minikube
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  MINIKUBE_PROFILE: "minikube"
  K8S_NAMESPACE: "default"
  K8S_MANIFEST_DIR: "k8s"
  DEPLOYMENT_NAME: "task-api"
  CONTAINER_NAME: "task-api"
  IMAGE_NAME: "task-api"

jobs:
  test-build-deploy:
    name: Test, build image and deploy to Minikube
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Show runner environment
        run: |
          echo "User: $(whoami)"
          echo "Home: $HOME"
          echo "Runner: $RUNNER_NAME"
          java --version
          docker --version
          minikube version
          kubectl version --client

      - name: Run tests
        run: ./gradlew clean test

      - name: Verify Minikube cluster
        run: |
          minikube status --profile "${MINIKUBE_PROFILE}"
          kubectl config current-context
          kubectl get nodes

      - name: Define image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build image inside Minikube
        run: |
          minikube image build             --profile "${MINIKUBE_PROFILE}"             --tag "${IMAGE_NAME}:${IMAGE_TAG}"             .

      - name: Verify image in Minikube
        run: |
          minikube image ls             --profile "${MINIKUBE_PROFILE}"             | grep "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply             --namespace "${K8S_NAMESPACE}"             -f "${K8S_MANIFEST_DIR}/"

      - name: Update Deployment image
        run: |
          kubectl set image             --namespace "${K8S_NAMESPACE}"             "deployment/${DEPLOYMENT_NAME}"             "${CONTAINER_NAME}=${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Wait for rollout
        run: |
          kubectl rollout status             --namespace "${K8S_NAMESPACE}"             "deployment/${DEPLOYMENT_NAME}"             --timeout=180s

      - name: Show deployed resources
        run: |
          kubectl get deployment,pods,services             --namespace "${K8S_NAMESPACE}"             -o wide

      - name: Show diagnostics on failure
        if: failure()
        run: |
          echo "=== Minikube status ==="
          minikube status --profile "${MINIKUBE_PROFILE}" || true

          echo "=== Kubernetes resources ==="
          kubectl get deployment,pods,services             --namespace "${K8S_NAMESPACE}"             -o wide || true

          echo "=== Deployment description ==="
          kubectl describe deployment "${DEPLOYMENT_NAME}"             --namespace "${K8S_NAMESPACE}" || true

          echo "=== Recent events ==="
          kubectl get events             --namespace "${K8S_NAMESPACE}"             --sort-by=.metadata.creationTimestamp             | tail -n 50 || true

          echo "=== Pod logs ==="
          for pod in $(kubectl get pods             --namespace "${K8S_NAMESPACE}"             -l "app=${DEPLOYMENT_NAME}"             -o name 2>/dev/null); do
            echo "--- Logs for ${pod} ---"
            kubectl logs               --namespace "${K8S_NAMESPACE}"               "${pod}"               --all-containers=true               --tail=200 || true
          done
